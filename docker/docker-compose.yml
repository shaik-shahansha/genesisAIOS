services:

  # ── Ollama — local LLM inference engine ──────────────────────────────────────
  # GPU support: uses NVIDIA GPU automatically when available (nvidia runtime
  # detected). Set GENESIS_USE_GPU=false in .env to force CPU-only mode.
  ollama:
    image: ollama/ollama:latest
    container_name: genesis-ollama
    restart: unless-stopped
    # Port 11434 is NOT exposed to the host by default.
    # Other containers reach Ollama via the Docker network (http://ollama:11434).
    # To expose externally, add ports: ["11434:11434"] in your own override file.
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
      - ./windows-cas.crt:/usr/local/share/ca-certificates/custom/windows-cas.crt:ro
    entrypoint: ["sh", "/ollama-entrypoint.sh"]
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_INSECURE=true
      # Set to 999 to use GPU, 0 to force CPU-only
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-0}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s

  # ── Genesis Daemon — Node.js OS kernel ───────────────────────────────────────
  daemon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: genesis-daemon
    restart: unless-stopped
    # Port binding is defined per-environment in override files.
    # Default local: 3000:3000 — add to your docker-compose.override.yml
    # VPS: 127.0.0.1:3001:3000 — defined in docker-compose.vps.yml
    depends_on:
      ollama:
        condition: service_healthy
      memory:
        condition: service_healthy
      voice:
        condition: service_healthy
    volumes:
      - genesis_data:/data
      - ${GENESIS_WORKSPACE:-./workspace}:/workspace
    environment:
      - GENESIS_MODEL=${GENESIS_MODEL:-gemma4:e4b}
      - GENESIS_MODEL_FALLBACK=${GENESIS_MODEL_FALLBACK:-gemma4:e2b,llama3.2:3b}
      - OLLAMA_BASE_URL=http://ollama:11434
      - GENESIS_PORT=3000
      - GENESIS_DATA_DIR=/data
      - GENESIS_PROJECT_ROOT=/workspace
      - GENESIS_USER_NAME=${GENESIS_USER_NAME:-User}
      - GENESIS_ALLOW_INSECURE_TLS=${GENESIS_ALLOW_INSECURE_TLS:-true}
      - GENESIS_APPROVAL_MODE=${GENESIS_APPROVAL_MODE:-true}
      - GENESIS_VOICE_ENABLED=true
      - MEMORY_SERVICE_URL=http://memory:7701
      - VOICE_SERVICE_URL=http://voice:7702
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ai/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Genesis Memory — ChromaDB vector memory sidecar ────────────────────────
  memory:
    build:
      context: ..
      dockerfile: docker/Dockerfile.memory
    container_name: genesis-memory
    restart: unless-stopped
    ports:
      - "7701:7701"
    volumes:
      - genesis_data:/data
    environment:
      - CHROMA_PATH=/data/chroma
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7701/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Genesis Voice — STT (faster-whisper) + TTS (kokoro) sidecar ───────────
  voice:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voice
    container_name: genesis-voice
    restart: unless-stopped
    volumes:
      - genesis_data:/data
      - ./windows-cas.crt:/usr/local/share/ca-certificates/custom/windows-cas.crt:ro
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - KOKORO_VOICE=${KOKORO_VOICE:-bf_emma}
      - HF_HOME=/data/hf_cache
      - HF_HUB_DISABLE_XET=1
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - GENESIS_ALLOW_INSECURE_TLS=${GENESIS_ALLOW_INSECURE_TLS:-true}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7702/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Model init — pull model if not present ───────────────────────────────────
  # NOTE: On corporate networks with SSL inspection, this may fail with a cert
  # error. If so, run manually once the stack is up:
  #   docker exec genesis-ollama ollama pull gemma4:e4b
  model-init:
    image: ollama/ollama:latest
    container_name: genesis-model-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint:
      - sh
      - -c
      - |
        echo "Pulling ${GENESIS_MODEL:-gemma4:e4b}..."
        ollama pull ${GENESIS_MODEL:-gemma4:e4b} && echo "Model ready" || echo "Pull failed — run: docker exec genesis-ollama ollama pull ${GENESIS_MODEL:-gemma4:e4b}"

volumes:
  ollama_data:
    driver: local
  genesis_data:
    driver: local
