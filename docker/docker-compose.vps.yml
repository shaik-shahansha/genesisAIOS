# VPS overlay for genesisos.genesisagi.in
#
# Usage:
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.override.yml \
#                  -f docker/docker-compose.vps.yml \
#                  up -d
#
# What this does:
#   - Skips the Ollama and model-init containers entirely (saves 3.7 GB image
#     pull + model download — host already runs Ollama on :11434)
#   - Points the daemon at the HOST's Ollama via host.docker.internal
#   - Binds the Genesis daemon to 127.0.0.1:3001 (localhost only, Nginx proxies it)

services:

  # Stub — replaced by host Ollama on :11434, daemon points there via extra_hosts
  ollama:
    image: alpine
    deploy:
      resources:
        reservations:
          devices: []
    entrypoint: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 1s

  # Stub — no model pull needed, host Ollama already has the model
  model-init:
    entrypoint: ["sh", "-c", "echo 'model-init skipped on VPS'"]
    restart: "no"

  # Stub — voice disabled on headless VPS
  voice:
    image: alpine
    entrypoint: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 1s

  daemon:
    ports:
      # Bind to localhost only — Nginx proxies genesisos.genesisagi.in → :3001
      - "127.0.0.1:3001:3000"
    extra_hosts:
      # Allows daemon container to reach host's Ollama on 127.0.0.1:11434
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GENESIS_VOICE_ENABLED=false
      - GENESIS_ALLOW_INSECURE_TLS=false
      - OLLAMA_NUM_GPU=0
    # Override depends_on — ollama and voice run on the host, not in Docker
    depends_on:
      memory:
        condition: service_healthy
